<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://platform.twitter.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://cohttpxzniquypkhalio.supabase.co wss://cohttpxzniquypkhalio.supabase.co https://www.youtube.com https://publish.twitter.com https://syndication.twitter.com https://cdn.syndication.twimg.com; frame-src https://platform.twitter.com https://syndication.twitter.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
<title>108掲示板</title>
<link rel="stylesheet" href="style.css" />
<script src="gateCheck.js"></script>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a href="#/" class="logo">108掲示板</a>
    <div class="header-right">
      <button type="button" id="theme-toggle" class="btn btn-small" title="ダークモード切替">ダークモード</button>
      <div class="my-id" id="my-id">ID: ---</div>
    </div>
  </div>
</header>

<div class="global-search">
  <div class="global-search-inner">
    <div class="search-bar">
      <input type="search" class="search-input" id="global-search-input" placeholder="スレッドのタイトルを検索" />
      <div class="search-mode-tabs">
        <button type="button" class="search-mode-tab active" data-mode="thread">スレッドを検索</button>
        <button type="button" class="search-mode-tab" data-mode="reply">レスを検索</button>
      </div>
    </div>
    <div class="search-results hidden" id="global-search-results"></div>
  </div>
</div>

<main id="app" class="container"></main>

<template id="tpl-list">
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="tabs">
        <button class="tab" data-tab="active">現行スレ</button>
        <button class="tab" data-tab="archived">過去スレ</button>
        <button class="tab" data-tab="bookmarks">お気に入り</button>
      </div>
      <div class="sort-toggle">
        <button type="button" class="sort-btn" data-sort="new">新着順</button>
        <button type="button" class="sort-btn" data-sort="ikioi">勢い順</button>
      </div>
    </div>
    <button class="btn btn-primary" id="new-thread-btn">＋ 新規スレッド</button>
  </div>

  <div class="new-thread-form hidden" id="new-thread-form">
    <input type="text" id="new-thread-title" placeholder="スレッドタイトル" maxlength="100" />
    <div class="image-attach">
      <label class="btn btn-small" for="new-thread-thumbnail">＋ スレッドのサムネイルを選択（任意）</label>
      <input type="file" id="new-thread-thumbnail" accept="image/*" class="hidden" />
      <div class="image-preview-list hidden" id="new-thread-thumbnail-preview"></div>
    </div>
    <textarea id="new-thread-content" placeholder="本文（最初の書き込み）" maxlength="2000" rows="4"></textarea>
    <div class="image-attach">
      <label class="btn btn-small" for="new-thread-image">＋ 画像を添付</label>
      <input type="file" id="new-thread-image" accept="image/*" multiple class="hidden" />
      <div class="image-preview-list hidden" id="new-thread-image-preview"></div>
    </div>
    <div class="form-actions">
      <span class="hint">名前欄はありません。投稿すると匿名IDが自動で付きます。</span>
      <div>
        <button class="btn" id="new-thread-cancel">キャンセル</button>
        <button class="btn btn-primary" id="new-thread-submit">スレを立てる</button>
      </div>
    </div>
  </div>

  <ul class="thread-list" id="thread-list"></ul>
  <p class="empty-msg hidden" id="empty-msg">スレッドはまだありません。</p>
</template>

<template id="tpl-thread">
  <div class="thread-header">
    <a href="#/" class="back-link">← 一覧に戻る</a>
    <h2 id="thread-title"></h2>
    <div class="thread-meta" id="thread-meta"></div>
  </div>

  <ol class="reply-list" id="reply-list"></ol>

  <div class="reply-form" id="reply-form">
    <textarea id="reply-content" placeholder="レスを書き込む" maxlength="2000" rows="3"></textarea>
    <div class="image-attach">
      <label class="btn btn-small" for="reply-image">＋ 画像を添付</label>
      <input type="file" id="reply-image" accept="image/*" multiple class="hidden" />
      <div class="image-preview-list hidden" id="reply-image-preview"></div>
    </div>
    <div class="form-actions">
      <span class="hint" id="reply-hint"></span>
      <button class="btn btn-primary" id="reply-submit">書き込む</button>
    </div>
  </div>
  <p class="empty-msg hidden" id="archived-msg">このスレッドは1000到達のため過去スレになりました。書き込みはできません。</p>
</template>

<div class="modal-backdrop hidden" id="report-modal">
  <div class="modal">
    <h3>通報する</h3>
    <p class="hint">運営に通報します。理由は任意です。</p>
    <textarea id="report-reason" maxlength="300" rows="3" placeholder="（任意）理由"></textarea>
    <div class="form-actions">
      <button class="btn" id="report-cancel">キャンセル</button>
      <button class="btn btn-danger" id="report-submit">通報する</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="confirm-modal">
  <div class="modal">
    <h3>確認</h3>
    <p class="hint" id="confirm-modal-message"></p>
    <div class="form-actions">
      <button class="btn" id="confirm-modal-cancel">キャンセル</button>
      <button class="btn btn-danger" id="confirm-modal-ok">削除する</button>
    </div>
  </div>
</div>

<div class="modal-backdrop hidden" id="lightbox">
  <button type="button" class="lightbox-close" id="lightbox-close" aria-label="閉じる">×</button>
  <img id="lightbox-img" alt="" />
</div>

<div class="toast hidden" id="toast"></div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script src="identity.js"></script>
<script src="app.js"></script>
</body>
</html>
