<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" />
<title>パスワード | 108掲示板</title>
<style>
  :root { --bg:#f4f5f7; --panel:#fff; --border:#dcdfe4; --text:#26282c; --accent:#3d7bfd; --danger:#e0445b; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
    color: var(--text);
  }
  .box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 24px;
    width: 90%;
    max-width: 320px;
    text-align: center;
  }
  .box h1 { font-size: 17px; margin: 0 0 6px; }
  .box p { font-size: 13px; color: #767b85; margin: 0 0 16px; }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: 2px;
  }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div class="box">
    <h1>108掲示板</h1>
    <p>入場にはパスワードが必要です</p>
    <input type="password" id="password" inputmode="numeric" placeholder="パスワードを入力" autofocus />
    <button id="submit">入る</button>
    <div class="error" id="error"></div>
  </div>

<script src="gateLogin.js"></script>
</body>
</html>
